name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Device smoke (macOS)
        run: flutter test -d macos integration_test/app_smoke_test.dart
