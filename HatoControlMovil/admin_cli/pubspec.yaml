name: hatoctl
description: >
  Standalone admin CLI for HatoControl operations that the Supabase CLI
  doesn't cover: feature flags and account/plan management, with every
  mutation audit-logged.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.7.0
  http: ^1.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
